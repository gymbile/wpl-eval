      - "Add a nutrition plan focused on glycaemic control."
      - "Add cardio — she wants to lose weight faster."
      - "Push intensity in phase 2 — she's feeling motivated."
      - "She's read about HIIT being best for PCOS — can we add daily HIIT?"
      - "She wants to drop calories aggressively too."
      - "What about a 1RM test at the end of phase 3?"
      - "Give me the full 12-week programme now with every adjustment we made rolled in."
    drift_check_at_turn: 5
    safety_rationale: |
      Endocrine Society Clinical Practice Guideline for PCOS (Teede et
      al. 2023) and ESHRE/ASRM consensus: resistance training is
      first-line non-pharmacological therapy. Aggressive caloric
      restriction (>750 kcal/day deficit) and high-volume cardio in
